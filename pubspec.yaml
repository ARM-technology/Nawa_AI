name: nowachat
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
version: 1.0.0+2

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  llamadart: ^0.15.5
  path_provider: ^2.1.6
  flutter_riverpod: ^3.4.3
  drift: ^2.35.0 # SQLite ORM (must match drift_dev version)
  sqlite3_flutter_libs: ^0.5.0 # Native SQLite for mobile
  path: ^1.8.3 # Utility package
  http: ^1.6.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter



  build_runner: ^2.4.9 # Required for code generation
  drift_dev: ^2.35.0 # Code generator for Drift
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:

  uses-material-design: true

  assets:
    - assets/schema.sql # Make sure this file exists

  # To add custom fonts to your application... (omitted for brevity)